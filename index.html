<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Platinum Dashboard</title>
    <meta name="description" content="Slash Banking" />
    <meta name="color-scheme" content="dark light" />
    <link rel="preload" href="/build/fonts/Inter/Inter-VariableFont_opsz,wght.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/assets/fonts/Archivo/Archivo-SemiBold.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      (function () {
        try {
          var forced = null;
          var storedTheme = localStorage.getItem('user-color-theme');
          var isDark = forced
            ? forced === 'dark'
            : storedTheme === 'dark' ||
              (storedTheme !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(isDark ? 'dark' : 'light');
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
